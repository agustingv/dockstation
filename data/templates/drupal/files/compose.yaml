name: {{SLUG}}

services:
  drupal:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION}
    ports:
      - "${HOST_PORT}:80"
    volumes:
      # Named volumes are initialised with the image content on first start.
      - drupal-modules:/opt/drupal/web/modules
      - drupal-profiles:/opt/drupal/web/profiles
      - drupal-themes:/opt/drupal/web/themes
      - drupal-sites:/opt/drupal/web/sites
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  drupal-modules:
  drupal-profiles:
  drupal-themes:
  drupal-sites:
  db-data:
