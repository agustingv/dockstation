# MySQL, added by DockStation.
# Other services connect to {{SERVICE}}:3306 with user and database "app";
# the password is {{PASSWORD_VAR}} in .env.

services:
  {{SERVICE}}:
    image: mysql:{{VERSION}}
    {{PORTS}}
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: {{PASSWORD_REF}}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - {{VOLUME}}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  {{VOLUME}}:
