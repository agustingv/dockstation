[Service]
Format=1
Name=PostgreSQL
Description=Relational database
Description[es]=Base de datos relacional
DefaultName=postgres
ContainerPort=5432

# PostgreSQL 18 images keep their data one level up, in a folder per major version.
[Version 18]
DATA_PATH=/var/lib/postgresql

[Version 17]
DATA_PATH=/var/lib/postgresql/data

[Version 16]
DATA_PATH=/var/lib/postgresql/data
