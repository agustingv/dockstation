[Service]
Format=1
Name=Tomcat
Description=Runs Java web applications (.war)
Description[es]=Ejecuta aplicaciones web Java (.war)
DefaultName=tomcat
ContainerPort=8080
HostPort=8082
Publish=true

[Version 11.0]
Description=Jakarta EE 11: applications that use jakarta.* packages
Description[es]=Jakarta EE 11: aplicaciones que usan paquetes jakarta.*
JDK=jdk21

[Version 10.1]
Description=Jakarta EE 10: applications that use jakarta.* packages
Description[es]=Jakarta EE 10: aplicaciones que usan paquetes jakarta.*
JDK=jdk21

[Version 9.0]
Description=Java EE 8: older applications that use javax.* packages
Description[es]=Java EE 8: aplicaciones antiguas que usan paquetes javax.*
JDK=jdk17

[Option FOLDER]
Type=folder
Title=Applications Folder
Title[es]=Carpeta de aplicaciones
Subtitle=Copy .war files here to deploy them
Subtitle[es]=Copie aquí los archivos .war para desplegarlos
Default={{SERVICE}}/webapps
