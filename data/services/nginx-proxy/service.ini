[Service]
Format=1
Name=Nginx Reverse Proxy
Description=Forwards requests to another service of the project
Description[es]=Reenvía las peticiones a otro servicio del proyecto
DefaultName=proxy
ContainerPort=80
HostPort=8000
Publish=true

[Version stable]
Description=Recommended for production
Description[es]=Recomendada para producción

[Version mainline]
Description=Newest features and fixes
Description[es]=Novedades y correcciones más recientes

[Option TARGET]
Type=service
Title=Forward To
Title[es]=Reenviar a

[Option TARGET_PORT]
Type=text
Title=Port of That Service
Title[es]=Puerto de ese servicio
Subtitle=The port the service listens on inside its container
Subtitle[es]=El puerto en el que escucha el servicio dentro de su contenedor
Default=80
